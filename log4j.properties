# log4j.properties
# Set root logger level to ERROR to suppress most Spark logs
log4j.rootLogger=ERROR, console

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Suppress specific Spark/Hadoop loggers
log4j.logger.org.apache.spark=ERROR
log4j.logger.org.apache.hadoop=ERROR
log4j.logger.org.spark_project=ERROR
log4j.logger.org.apache.parquet=ERROR
log4j.logger.parquet=ERROR
log4j.logger.org.eclipse.jetty=ERROR
log4j.logger.io.netty=ERROR

# Keep your application logs at INFO level (adjust package name)
#log4j.logger.com.scala=INFO
